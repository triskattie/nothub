services:
  api:
    image: nothub-api-dev
    build:
      context: .
      dockerfile: api/Dockerfile
    pull_policy: build
    develop:
      watch:
        - action: rebuild
          path: ./api
    
  db:
    ports: 
      - "5432:5432"
  
  migrate:
    image: nothub-api-dev
    build:
      context: .
      dockerfile: api/Dockerfile
    pull_policy: build

  web:
    image: nothub-web-dev
    build:
      context: .
      dockerfile: web/Dockerfile
    pull_policy: build
    develop:
      watch:
        - action: rebuild
          path: ./web