<article class="entry-edit">
    <h1>Edit entry</h1>
    <form
    method="post"
    action="/entries/{{ entry.id }}/edit"
    onsubmit="return('Are you sure you want edit this entry?')"
    >
    <label for="title">Title</label><br>
    <input type="text" name="title" value="{{ entry.payload['title'] }}">
    <label for description>Description</label><br>
    <input type="text" name="description" value="{{ entry.payload['description'] }}">
    <label for="type">Type</label><br>
    <input type="text" name="type" value="{{ entry.type if entry.type != None else ''}}" >
    <button type="submit">Submit</button>
    </form>
</article>
