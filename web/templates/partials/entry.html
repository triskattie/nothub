<article class="entry">
    <div class="entry-top">
        <div>
            <div class="title-and-type">
                <h2>{{ entry.payload.title }}</h2>
                {% if entry.type is not none %}
                    <p><strong>{{ entry.type }}</strong></p>
                {% endif %}          
            </div>

            <p>{{ entry.payload.description }}</p>
        </div>
        <div class="action-buttons">
            <a href="/entries/{{ entry.id }}/edit">
                <button type="button">
                    Edit
                </button>
            </a>
            <form
                method="post"
                action="/entries/{{ entry.id }}/delete"
                onsubmit="return confirm('Delete this entry?');"
            >
                <button type="submit">
                    Delete
                </button>
            </form>            
        </div>

    </div>
    <p class="entry-meta">
        <span>{{ entry.provider }}</span>
        <span aria-hidden="true">·</span>
        <time datetime="{{ entry.created_at }}">{{ entry.created_at }}</time>
    </p>
</article>
