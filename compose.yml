services:
  api:
    image: ghcr.io/triskattie/nothub:${NOTHUB_VERSION:-latest}
    pull_policy: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  migrate:
    image: ghcr.io/triskattie/nothub:${NOTHUB_VERSION:-latest}
    pull_policy: always
    env_file:
      - .env
    command: uv run alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: